        /* ── Base ─────────────────────────────────────────────────────────── */
        html {
            height: -webkit-fill-available;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #0a0d14;
            color: white;

        }

        /* Remove iOS tap highlight flash */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Scrollbar ────────────────────────────────────────────────────── */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ── iOS Safari: backdrop-filter webkit prefix ────────────────────── */
        /* Tailwind CDN may omit -webkit- prefix; add it statically */
        [class*="backdrop-blur"] {
            -webkit-backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
            backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
        }

        /* ── iOS Safari: min-height viewport fix ─────────────────────────── */
        .min-h-screen {
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        /* ── Pulse ring animation ─────────────────────────────────────────── */
        .pulse-ring {
            box-shadow: 0 0 0 0 rgba(113, 129, 255, 0.55);
            animation: pulse-blue 2s infinite;
        }

        @keyframes pulse-blue {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(113, 129, 255, 0.55);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(113, 129, 255, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(113, 129, 255, 0);
            }
        }

        /* ── Tailwind animate-in/out — pre-defined for iOS Safari ─────────
           Tailwind CDN injects these AFTER React renders. On iOS Safari,
           dynamically-injected animation CSS won't re-trigger for elements
           already in the DOM, leaving them permanently at opacity:0.
           Defining keyframes here (before React renders) fixes that.
        ──────────────────────────────────────────────────────────────────── */
        :root {
            --tw-enter-opacity: 1;
            --tw-enter-scale: 1;
            --tw-enter-rotate: 0deg;
            --tw-enter-translate-x: 0;
            --tw-enter-translate-y: 0;
            --tw-exit-opacity: 1;
            --tw-exit-scale: 1;
            --tw-exit-rotate: 0deg;
            --tw-exit-translate-x: 0;
            --tw-exit-translate-y: 0;
        }

        @keyframes enter {
            from {
                opacity: var(--tw-enter-opacity, 1);
                transform: translate3d(var(--tw-enter-translate-x, 0), var(--tw-enter-translate-y, 0), 0)
                           scale3d(var(--tw-enter-scale, 1), var(--tw-enter-scale, 1), var(--tw-enter-scale, 1))
                           rotate(var(--tw-enter-rotate, 0deg));
            }
        }

        @keyframes exit {
            to {
                opacity: var(--tw-exit-opacity, 1);
                transform: translate3d(var(--tw-exit-translate-x, 0), var(--tw-exit-translate-y, 0), 0)
                           scale3d(var(--tw-exit-scale, 1), var(--tw-exit-scale, 1), var(--tw-exit-scale, 1))
                           rotate(var(--tw-exit-rotate, 0deg));
            }
        }

        .animate-in {
            animation-name: enter;
            animation-fill-mode: both;
        }

        .animate-out {
            animation-name: exit;
            animation-fill-mode: both;
        }

        /* fade */
        .fade-in  { --tw-enter-opacity: 0; }
        .fade-out { --tw-exit-opacity: 0; }

        /* zoom */
        .zoom-in-95  { --tw-enter-scale: .95; }
        .zoom-out-95 { --tw-exit-scale: .95; }

        /* slide */
        .slide-in-from-bottom-2 { --tw-enter-translate-y:  0.5rem; }
        .slide-in-from-bottom-4 { --tw-enter-translate-y:  1rem; }
        .slide-in-from-bottom-8 { --tw-enter-translate-y:  2rem; }
        .slide-out-to-bottom-2  { --tw-exit-translate-y:   0.5rem; }
        .slide-out-to-bottom-4  { --tw-exit-translate-y:   1rem; }

        /* duration */
        .duration-150       { animation-duration: 150ms; }
        .duration-200       { animation-duration: 200ms; }
        .duration-300       { animation-duration: 300ms; }
        .duration-500       { animation-duration: 500ms; }
        .duration-700       { animation-duration: 700ms; }
        .duration-\[180ms\] { animation-duration: 180ms; }

        /* ── Branded Favicon Page Loader ─────────────────────────────────── */
        .ga-loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        .ga-loader-icon-wrapper {
            position: relative;
            width: 104px;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ga-loader-glow {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(113, 129, 255, 0.32) 0%, rgba(113, 129, 255, 0) 70%);
            filter: blur(16px);
            pointer-events: none;
            animation: ga-pulse-glow 2.4s ease-in-out infinite alternate;
        }

        .ga-loader-orbit {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(113, 129, 255, 0.15);
            border-top-color: #7181ff;
            border-right-color: rgba(113, 129, 255, 0.7);
            animation: ga-spin 1.25s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            pointer-events: none;
        }

        .ga-loader-orbit-inner {
            position: absolute;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.18);
            animation: ga-spin-reverse 7s linear infinite;
            pointer-events: none;
        }

        .ga-loader-favicon-box {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 20px;
            background: rgba(20, 25, 37, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.5), 0 0 24px rgba(113, 129, 255, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            animation: ga-favicon-breathe 2.4s ease-in-out infinite;
        }

        .ga-loader-favicon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(113, 129, 255, 0.5));
        }

        .ga-loader-bar-wrap {
            width: 136px;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
            margin-top: 22px;
        }

        .ga-loader-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent 0%, #7181ff 50%, transparent 100%);
            animation: ga-shimmer-travel 1.8s ease-in-out infinite;
        }

        .ga-loader-brand {
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ga-loader-brand-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #7181ff;
            animation: ga-ping-dot 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .ga-loader-brand-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.22em;
            color: #949cad;
            text-transform: uppercase;
            font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        }

        .ga-loader-message {
            margin-top: 6px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: #626b7d;
            font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        }

        @keyframes ga-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes ga-spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes ga-favicon-breathe {
            0%, 100% {
                transform: scale(0.95);
                box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45), 0 0 18px rgba(113, 129, 255, 0.25);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 30px rgba(113, 129, 255, 0.6);
            }
        }

        @keyframes ga-pulse-glow {
            0% {
                opacity: 0.35;
                transform: scale(0.9);
            }
            100% {
                opacity: 0.9;
                transform: scale(1.15);
            }
        }

        @keyframes ga-shimmer-travel {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        @keyframes ga-ping-dot {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }
    </style>

            <h2 style="font-size:1.25rem;margin:32px 0 8px">What Guardian Angel DMS does</h2>
            <p>
                Guardian Angel DMS is a secure digital legacy management service. It stores the
                documents, photos, voice recordings, and written messages that matter most to you,
                and delivers them to the people you choose if you are no longer able to do so
                yourself.
            </p>
            <p>
                You upload your files to an encrypted vault, assign each item to specific trusted
                recipients, and check in on a schedule you set. Every check-in resets your countdown
                timer. If the timer ever expires because you have stopped checking in, Guardian Angel
                DMS automatically emails each recipient only the items you assigned to them — nothing
                else, and no one else.
            </p>

            <h2 style="font-size:1.25rem;margin:32px 0 8px">How Guardian Angel DMS uses your Google account</h2>
            <p>
                Signing in with Google is optional and is used only to create and access your
                Guardian Angel DMS account. We request your basic profile and email address so we can
                identify your account and contact you about check-ins. We do not read, store, or
                share any other Google data, and we never sell your information.
            </p>
